<style>
html,body{height:100%}
body{overflow-x:hidden;transition:background .5s,color .5s;padding-bottom:150px}
header,main,footer{position:relative;z-index:2}
header{background:#120f2bb3;backdrop-filter:blur(8px);transition:background .5s}
#sky{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px) saturate(1.6);opacity:.6;transition:opacity .5s}
#sky i{position:absolute;width:42vmax;height:42vmax;border-radius:50%;mix-blend-mode:screen;animation:drift 22s ease-in-out infinite alternate}
#sky i:nth-child(1){left:2%;top:4%;background:#ff3b5c}
#sky i:nth-child(2){left:52%;top:-6%;background:#ffd92e;animation-duration:27s;animation-delay:-6s}
#sky i:nth-child(3){left:30%;top:46%;background:#2fd6ff;animation-duration:31s;animation-delay:-12s}
#sky i:nth-child(4){left:-8%;top:54%;background:#7a5cff;animation-duration:25s;animation-delay:-3s}
#sky i:nth-child(5){left:64%;top:50%;background:#5fe04a;animation-duration:29s;animation-delay:-17s}
#sky i:nth-child(6){left:40%;top:10%;background:#ff5fd2;animation-duration:35s;animation-delay:-9s}
#sky i:nth-child(7){left:78%;top:18%;background:#ff8a1f;animation-duration:24s;animation-delay:-14s}
#sky i:nth-child(8){left:12%;top:28%;background:#1fe0a8;animation-duration:33s;animation-delay:-20s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(12vmax,-8vmax) scale(1.25)}100%{transform:translate(-10vmax,9vmax) scale(.85)}}
#beams{position:fixed;left:50%;top:50%;width:220vmax;height:220vmax;margin:-110vmax 0 0 -110vmax;z-index:0;pointer-events:none;opacity:.16;mix-blend-mode:screen;transition:opacity .4s;
 background:repeating-conic-gradient(from 0deg,#ff3b5c 0 4deg,transparent 4deg 12deg,#ff8a1f 12deg 15deg,transparent 15deg 22deg,#ffd92e 22deg 25deg,transparent 25deg 33deg,#5fe04a 33deg 36deg,transparent 36deg 44deg,#2fd6ff 44deg 48deg,transparent 48deg 56deg,#7a5cff 56deg 59deg,transparent 59deg 66deg,#ff5fd2 66deg 69deg,transparent 69deg 72deg);
 -webkit-mask:radial-gradient(circle,transparent 0,#000 22%,transparent 62%);mask:radial-gradient(circle,transparent 0,#000 22%,transparent 62%);animation:spin 90s linear infinite}
body.frenzy #beams{opacity:.42;animation-duration:9s}
@keyframes spin{to{transform:rotate(360deg)}}
#c{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
main{max-width:none;min-height:calc(100vh - 300px);display:grid;place-items:center;text-align:center;padding:30px 16px 30px}
.kick{font-size:13px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin:0}
h1{margin:.12em 0 .1em;font-size:clamp(42px,11vw,140px);font-weight:900;letter-spacing:-.03em;line-height:.95;filter:drop-shadow(0 6px 0 #0006) drop-shadow(0 0 34px #ffffff33)}
h1 span{display:inline-block;color:#ff3b5c;animation:bop 1.6s ease-in-out infinite,hue 5s linear infinite;animation-delay:calc(var(--i)*-.13s),calc(var(--i)*-.55s)}
@keyframes hue{to{filter:hue-rotate(360deg)}}
@keyframes bop{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-.06em) rotate(calc((var(--i) - 4)*.6deg))}}
.tag{font-size:clamp(16px,2.2vw,20px);max-width:560px;margin:10px auto 22px;text-shadow:0 2px 12px #0009}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{font:inherit}
.row button,#shop button{font-weight:800;border:0;cursor:pointer;color:#1a1030;background:#fff;box-shadow:0 5px 0 #0005;transition:transform .12s,box-shadow .12s,opacity .2s}
.row button{font-size:16px;padding:11px 20px;border-radius:999px}
.row button:hover,#shop button:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 7px 0 #0005}
.row button:active,#shop button:not(:disabled):active{transform:translateY(3px);box-shadow:0 2px 0 #0005}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{opacity:.45;cursor:default}
#pour{background:linear-gradient(90deg,#ffd92e,#ff8a1f)}
#flavor{background:linear-gradient(90deg,#2fd6ff,#5fe04a)}
#milk{background:#fff6e6}
#hud{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:10px 16px 12px;background:#120f2bd9;backdrop-filter:blur(10px);border-top:1px solid var(--line);display:grid;gap:8px;transition:background .5s}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.lv{font-weight:900;font-size:15px;letter-spacing:.08em;white-space:nowrap}
.lv b{font-size:22px;color:#ffd92e}
.bar{position:relative;flex:1 1 180px;height:22px;border-radius:999px;background:#0006;overflow:hidden;border:1px solid var(--line)}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:linear-gradient(90deg,#ff3b5c,#ff8a1f,#ffd92e,#5fe04a,#2fd6ff,#7a5cff,#ff5fd2);background-size:300px 100%;transition:width .2s}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000}
.pts{font-weight:800;white-space:nowrap}.pts b{font-size:20px;color:#5fe04a;font-variant-numeric:tabular-nums}
#combo{font-weight:900;color:#ff5fd2;min-width:70px;font-variant-numeric:tabular-nums}
.low{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
#tray{display:flex;gap:6px;flex-wrap:wrap}
#tray span{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--dim)}
#tray i{width:13px;height:13px;border-radius:40% 55% 45% 60%;display:block;box-shadow:inset -2px -2px 0 #0003}
#shop{display:flex;gap:8px;flex-wrap:wrap}
#shop button{font-size:13px;padding:7px 12px;border-radius:10px;line-height:1.25;text-align:left;box-shadow:0 3px 0 #0005}
#shop small{display:block;font-weight:700;opacity:.7}
#reset{background:none;border:0;color:var(--dim);font-size:12px;text-decoration:underline;cursor:pointer;padding:4px}
#toast{position:fixed;left:50%;top:26%;z-index:4;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;font-weight:900;font-size:clamp(26px,6vw,64px);line-height:1.1;color:#fff;text-shadow:0 4px 0 #0008,0 0 30px #ff5fd2}
#toast small{display:block;font-size:.38em;letter-spacing:.06em;color:#ffd92e}
#toast.go{animation:toast 2.4s ease-out}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
body.milk{background:#fff4df;color:#2a1c3d;--dim:#6b5a80;--line:#ecd9b8}
body.milk header{background:#fff4dfcc}
body.milk #hud{background:#fff4dfe6}
body.milk .bar{background:#2a1c3d22}
body.milk .pts b{color:#0f9d58}body.milk .lv b{color:#e07a00}
body.milk #sky{opacity:.4}
body.milk #sky i{mix-blend-mode:multiply}
body.milk #beams{mix-blend-mode:multiply;opacity:.1}
body.milk.frenzy #beams{opacity:.3}
body.milk .tag{text-shadow:none}
body.milk h1{filter:drop-shadow(0 6px 0 #2a1c3d22)}
@media (max-width:600px){body{padding-bottom:210px}#tray span{font-size:11px}}
@media (prefers-reduced-motion:reduce){#sky i,#beams{animation:none}h1 span{animation:none;filter:hue-rotate(calc(var(--i)*40deg))}}
</style>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var title=$('title');
title.innerHTML=title.textContent.split('').map(function(ch,i){return '<span aria-hidden="true" style="--i:'+i+'">'+ch+'</span>'}).join('');

var cv=$('c'),g=cv.getContext('2d'),W=0,H=0,D=1;
var FLAVORS=[
 ['Fruity',1,['#ff3b5c','#ff8a1f','#ffc21f','#fff04a','#b6f23a','#5fe04a','#1fe0a8','#2fd6ff','#4a8cff','#7a5cff','#c04dff','#ff5fd2']],
 ['Emerald',3,['#34d399','#10b981','#a7f3d0','#5fe04a','#d9f99d','#2ee6d0','#ffffff','#6ee7b7','#bef264','#14b8a6','#86efac','#fef08a']],
 ['Berry',5,['#ff5fd2','#c026d3','#7a5cff','#3b82f6','#ff3b5c','#f9a8d4','#a5b4fc','#e11d48','#9333ea','#f472b6','#60a5fa','#fb7185']],
 ['Sherbet',7,['#ffb3c7','#ffd6a5','#fdffb6','#caffbf','#9bf6ff','#a0c4ff','#bdb2ff','#ffc6ff','#ffadad','#b9fbc0','#fbf8cc','#f1c0e8']],
 ['Neon',10,['#ff0055','#ff5e00','#ffe600','#aaff00','#00ff66','#00ffd5','#00b3ff','#0055ff','#7700ff','#d400ff','#ff00aa','#ffffff']]
];
var NC=12,SS=56,spr=[],starSpr,prismSpr;
var UPS=[['Bigger spoon',50,'wider reach'],['Extra sugar',120,'+50% crunch'],['Auto-pour',80,'fuller bowl'],['Lucky scoop',200,'more rares']];
var S={xp:0,lv:1,pts:0,up:[0,0,0,0],col:[],total:0,fl:0};
for(var q=0;q<NC;q++)S.col.push(0);
try{var sv=JSON.parse(localStorage.getItem('prismcrunch1'));if(sv&&sv.col&&sv.col.length===NC&&sv.up.length===4)S=sv}catch(e){}
if(!FLAVORS[S.fl]||FLAVORS[S.fl][1]>S.lv)S.fl=0;
var saveT=0;function save(){try{localStorage.setItem('prismcrunch1',JSON.stringify(S))}catch(e){}}

function shade(hex,k){var n=parseInt(hex.slice(1),16),r=n>>16,gr=n>>8&255,b=n&255;
 function f(v){return Math.max(0,Math.min(255,Math.round(k>0?v+(255-v)*k:v*(1+k))))}
 return 'rgb('+f(r)+','+f(gr)+','+f(b)+')'}
function cvs(){var c=document.createElement('canvas');c.width=c.height=SS;return c}
function grad(x,col){var R=SS/2,gr=x.createRadialGradient(R*.75,R*.65,2,R,R,R);gr.addColorStop(0,shade(col,.45));gr.addColorStop(.55,col);gr.addColorStop(1,shade(col,-.28));return gr}
function pores(x,col,rnd,n){var R=SS/2;x.fillStyle=shade(col,-.4);x.globalAlpha=.35;
 for(var i=0;i<n;i++){x.beginPath();x.arc(R+(rnd()-.5)*R*1.3,R+(rnd()-.5)*R*1.3,1+rnd()*2.4,0,6.3);x.fill()}x.globalAlpha=1}
function rng(seed){return function(){seed=(seed*16807)%2147483647;return seed/2147483647}}
function flake(col,seed){var c=cvs(),x=c.getContext('2d'),R=SS/2,n=9,pts=[],i,rnd=rng(seed);
 for(i=0;i<n;i++){var a=i/n*6.283,r=R*(.62+rnd()*.3);pts.push([R+Math.cos(a)*r,R+Math.sin(a)*r*(.72+rnd()*.2)])}
 x.beginPath();
 for(i=0;i<n;i++){var p=pts[i],q=pts[(i+1)%n],q2=pts[(i+2)%n];if(!i)x.moveTo((p[0]+q[0])/2,(p[1]+q[1])/2);
  x.quadraticCurveTo(q[0],q[1],(q[0]+q2[0])/2,(q[1]+q2[1])/2)}
 x.closePath();x.fillStyle=grad(x,col);x.fill();x.save();x.clip();pores(x,col,rnd,7);
 x.globalAlpha=.55;x.fillStyle='#fff';x.beginPath();x.ellipse(R*.72,R*.62,R*.26,R*.11,-.5,0,6.3);x.fill();x.restore();return c}
function ring(col,seed){var c=cvs(),x=c.getContext('2d'),R=SS/2,rnd=rng(seed);
 x.beginPath();x.arc(R,R,R*.86,0,6.283);x.arc(R,R,R*.36,0,6.283,true);x.fillStyle=grad(x,col);x.fill('evenodd');
 x.save();x.clip('evenodd');pores(x,col,rnd,10);
 x.globalAlpha=.6;x.strokeStyle='#fff';x.lineWidth=3.5;x.lineCap='round';x.beginPath();x.arc(R,R,R*.64,3.6,4.7);x.stroke();x.restore();
 x.strokeStyle=shade(col,-.35);x.globalAlpha=.5;x.lineWidth=1.5;x.beginPath();x.arc(R,R,R*.36,0,6.283);x.stroke();return c}
function star(){var c=cvs(),x=c.getContext('2d'),R=SS/2,i;x.beginPath();
 for(i=0;i<10;i++){var a=i/10*6.283-1.571,r=i%2?R*.42:R*.92;x[i?'lineTo':'moveTo'](R+Math.cos(a)*r,R+Math.sin(a)*r)}
 x.closePath();x.lineJoin='round';x.lineWidth=5;x.strokeStyle='#ffb300';x.stroke();
 var gr=x.createRadialGradient(R*.8,R*.7,1,R,R,R);gr.addColorStop(0,'#fffbe0');gr.addColorStop(.6,'#ffe14a');gr.addColorStop(1,'#ffa800');x.fillStyle=gr;x.fill();return c}
function prism(){var c=cvs(),x=c.getContext('2d'),R=SS/2,i;
 for(i=0;i<6;i++){var a=i/6*6.283,b=(i+1)/6*6.283;x.beginPath();x.moveTo(R,R);x.lineTo(R+Math.cos(a)*R*.94,R+Math.sin(a)*R*.94);x.lineTo(R+Math.cos(b)*R*.94,R+Math.sin(b)*R*.94);x.closePath();
  x.fillStyle='hsl('+i*60+',100%,'+(i%2?62:72)+'%)';x.fill()}
 x.globalAlpha=.75;x.fillStyle='#fff';x.beginPath();
 for(i=0;i<6;i++){a=i/6*6.283+.52;x[i?'lineTo':'moveTo'](R+Math.cos(a)*R*.4,R+Math.sin(a)*R*.4)}x.fill();return c}
function bake(){spr=[];var cols=FLAVORS[S.fl][2];
 for(var i=0;i<NC;i++)spr.push([flake(cols[i],1234+i*97),flake(cols[i],777+i*53),flake(cols[i],4242+i*11),ring(cols[i],99+i*7)]);
 var tr=$('tray'),h='';for(i=0;i<NC;i++)h+='<span><i style="background:'+cols[i]+'"></i><b id="t'+i+'">0</b></span>';tr.innerHTML=h;dirty=true}
starSpr=star();prismSpr=prism();

var P=[],rings=[],stars=[],floats=[],mx=-9999,my=-9999,pvx=0,pvy=0,t=0,dirty=true;
var combo=0,comboT=0,frenzy=0,slurpCd=0,pourCd=0;
function fmt(n){return n<1e4?''+Math.floor(n):n<1e6?(n/1e3).toFixed(1)+'K':n<1e9?(n/1e6).toFixed(2)+'M':(n/1e9).toFixed(2)+'B'}
function need(l){return Math.round(40*Math.pow(l,1.6))}
function cost(i){return Math.round(UPS[i][1]*Math.pow(1.7,S.up[i]))}
function reach(){return 90+18*S.up[0]}
function roll(p){var L=S.up[3],r=Math.random();
 p.kind=r<.004*(1+.5*L)?3:r<.004*(1+.5*L)+.03*(1+.3*L)?2:r<.3?1:0;
 p.c=Math.random()*NC|0;p.sh=Math.random()*3|0;
 p.s=p.kind===3?.8:p.kind===2?.62:.38+Math.random()*.42}
function mk(x,y,vx,vy,life){var p={x:x,y:y,vx:vx,vy:vy,z:.4+Math.random()*.6,r:Math.random()*6.28,vr:(Math.random()-.5)*.05,life:life||0,age:0,ph:Math.random()*6.28};roll(p);return p}
function base(){return Math.round(Math.min(380,Math.max(110,W*H/5200))*(1+.12*S.up[2]))}
function fill(){var b=base(),n=0,i;for(i=0;i<P.length;i++)if(!P[i].life)n++;
 for(;n<b;n++)P.push(mk(Math.random()*W,Math.random()*H,0,0));
 if(n>b){var cut=n-b;P=P.filter(function(p){return p.life||cut--<=0})}
 stars=[];for(i=0;i<46;i++)stars.push({x:Math.random(),y:Math.random(),p:Math.random()*6.28,s:2+Math.random()*5,h:Math.random()*360})}
function size(){D=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);fill()}

function toast(a,b){var el=$('toast');el.innerHTML=a+(b?'<small>'+b+'</small>':'');el.classList.remove('go');void el.offsetWidth;el.classList.add('go')}
function pour(n,life){n=Math.min(n,1000-P.length);
 for(var i=0;i<n;i++)P.push(mk(W*(.1+Math.random()*.8),-30-Math.random()*H*.7,(Math.random()-.5)*2,4+Math.random()*7,life+Math.random()*300))}
function levelUp(){var msg='';for(var i=0;i<FLAVORS.length;i++)if(FLAVORS[i][1]===S.lv)msg=FLAVORS[i][0]+' flavor unlocked!';
 toast('LEVEL '+S.lv+'!',msg||'Bonus pour!');pour(90,500);rings.push({x:W/2,y:H/2,r:8,a:1});flavorLabel()}
function collect(p){var vals=[1,3,10,50],v=vals[p.kind]*(1+.5*S.up[1]);
 combo++;comboT=80;var m=1+Math.min(combo,100)*.02;if(frenzy)m*=2;v=Math.max(1,Math.round(v*m));
 S.xp+=v;S.pts+=v;S.total++;if(p.kind<2)S.col[p.c]++;
 while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;levelUp()}
 var col=p.kind===3?'#ffffff':p.kind===2?'#ffe14a':FLAVORS[S.fl][2][p.c];
 if(floats.length<70)floats.push({x:p.x,y:p.y,tx:'+'+fmt(v),c:col,a:0,b:p.kind>1?26:p.kind?17:13});
 if(p.kind===3){frenzy=540;document.body.classList.add('frenzy');toast('PRISM FRENZY!','Double crunch');pour(160,480);rings.push({x:p.x,y:p.y,r:8,a:1})}
 else if(p.kind===2)rings.push({x:p.x,y:p.y,r:4,a:.6});
 dirty=true}
function slurp(x,y){if(slurpCd>0)return;slurpCd=45;
 for(var i=0;i<P.length;i++){var p=P[i],dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy)+1;if(d<400){var f=(1-d/400)*16;p.vx+=dx/d*f;p.vy+=dy/d*f}}
 rings.push({x:x,y:y,r:8,a:1})}

function step(){
 t+=.016;pvx*=.85;pvy*=.85;if(slurpCd>0)slurpCd--;
 if(comboT>0&&--comboT===0){combo=0;dirty=true}
 if(frenzy>0&&--frenzy===0)document.body.classList.remove('frenzy');
 if(pourCd>0&&--pourCd===0)$('pour').disabled=false;
 var R=reach(),R2=R*R;
 for(var i=P.length-1;i>=0;i--){var p=P[i];
  var a=Math.sin(p.x*.0026+t*.35)+Math.cos(p.y*.0031-t*.27)+p.ph;
  p.vx+=Math.cos(a*1.7)*.035*p.z;p.vy+=Math.sin(a*1.7)*.035*p.z+.012*p.z;
  var dx=mx-p.x,dy=my-p.y,d2=dx*dx+dy*dy;
  if(d2<R2){var d=Math.sqrt(d2)+1;
   if(d<20+p.s*16){collect(p);if(p.life)P.splice(i,1);else{p.x=Math.random()*W;p.y=-40-Math.random()*90;p.vx=0;p.vy=1;roll(p)}continue}
   var f=(1-d/R)*1.5+.25;p.vx+=dx/d*f+pvx*.01;p.vy+=dy/d*f+pvy*.01;p.vr+=.004}
  p.vx*=.965;p.vy*=.965;p.vr*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr+(p.kind===3?.05:.004);
  if(p.life&&++p.age>p.life){P.splice(i,1);continue}
  if(p.x<-40)p.x=W+40;else if(p.x>W+40)p.x=-40;
  if(p.y>H+40)p.y=-40;else if(p.y<-140&&p.vy<0)p.y=H+40}
 for(i=rings.length-1;i>=0;i--){var r=rings[i];r.r+=9;r.a*=.955;if(r.a<.03)rings.splice(i,1)}
 for(i=floats.length-1;i>=0;i--){var fl=floats[i];fl.y-=1.3;if(++fl.a>55)floats.splice(i,1)}
 if(++saveT>300){saveT=0;save()}}
function draw(){
 g.clearRect(0,0,W,H);var i,k;
 g.globalCompositeOperation='lighter';
 for(i=0;i<stars.length;i++){var s=stars[i],tw=.5+.5*Math.sin(t*2.2+s.p),sz=s.s*(.4+tw),x=s.x*W,y=s.y*H;
  g.globalAlpha=tw*.8;g.fillStyle='hsl('+((s.h+t*40)%360)+',100%,72%)';
  g.beginPath();g.moveTo(x,y-sz);g.quadraticCurveTo(x,y,x+sz,y);g.quadraticCurveTo(x,y,x,y+sz);g.quadraticCurveTo(x,y,x-sz,y);g.quadraticCurveTo(x,y,x,y-sz);g.fill()}
 for(i=0;i<rings.length;i++){var r=rings[i];
  for(k=0;k<6;k++){g.globalAlpha=r.a*.7;g.strokeStyle='hsl('+(k*55+t*120)%360+',100%,62%)';g.lineWidth=5;g.beginPath();g.arc(r.x,r.y,Math.max(1,r.r-k*7),0,6.283);g.stroke()}}
 if(mx>-9000){var R=reach();g.lineWidth=3;
  for(k=0;k<12;k++){g.globalAlpha=.55;g.strokeStyle='hsl('+((k*30+t*90)%360)+',100%,65%)';g.beginPath();g.arc(mx,my,R,k/12*6.283+t*.6,(k+.7)/12*6.283+t*.6);g.stroke()}}
 g.globalCompositeOperation='source-over';
 for(i=0;i<P.length;i++){var p=P[i],al=.5+p.z*.5;
  if(p.life){var left=p.life-p.age;if(left<50)al*=left/50}
  var sc=p.s*(p.kind>1?1+.12*Math.sin(t*6+p.ph):1),c=Math.cos(p.r)*sc,sn=Math.sin(p.r)*sc;
  g.globalAlpha=p.kind>1?1:al;g.setTransform(c*D,sn*D,-sn*D,c*D,p.x*D,p.y*D);
  g.drawImage(p.kind===3?prismSpr:p.kind===2?starSpr:spr[p.c][p.kind?3:p.sh],-SS/2,-SS/2)}
 g.setTransform(D,0,0,D,0,0);
 g.textAlign='center';g.lineJoin='round';
 for(i=0;i<floats.length;i++){var f=floats[i];g.globalAlpha=Math.min(1,(55-f.a)/20);g.font='900 '+f.b+'px system-ui,sans-serif';
  g.lineWidth=4;g.strokeStyle='#1a1030';g.strokeText(f.tx,f.x,f.y);g.fillStyle=f.c;g.fillText(f.tx,f.x,f.y)}
 g.globalAlpha=1}
function hud(){if(!dirty)return;dirty=false;var n=need(S.lv);
 $('lv').textContent=S.lv;$('xpb').style.width=(S.xp/n*100)+'%';$('xpt').textContent=fmt(S.xp)+' / '+fmt(n)+' XP';
 $('pts').textContent=fmt(S.pts);
 $('combo').textContent=combo>4?'x'+((1+Math.min(combo,100)*.02)*(frenzy?2:1)).toFixed(2)+' combo':'';
 for(var i=0;i<NC;i++){var el=$('t'+i);if(el)el.textContent=fmt(S.col[i])}
 var b=$('shop').children;for(i=0;i<b.length;i++){b[i].disabled=S.pts<cost(i);b[i].lastChild.textContent='Lv '+S.up[i]+' · '+fmt(cost(i))}}
function loop(){step();draw();hud();requestAnimationFrame(loop)}

function flavorLabel(){var nx=null;for(var i=0;i<FLAVORS.length;i++)if(FLAVORS[i][1]>S.lv){nx=FLAVORS[i];break}
 $('flavor').textContent='Flavor: '+FLAVORS[S.fl][0]+(nx?' (next at Lv '+nx[1]+')':'')}
(function(){var h='';for(var i=0;i<UPS.length;i++)h+='<button type="button" data-i="'+i+'" title="'+UPS[i][2]+'">'+UPS[i][0]+'<small></small></button>';$('shop').innerHTML=h})();
$('shop').onclick=function(e){var b=e.target.closest('button');if(!b)return;var i=+b.dataset.i,c=cost(i);if(S.pts<c)return;S.pts-=c;S.up[i]++;if(i===2)fill();dirty=true;save()};
$('pour').onclick=function(){pour(130,520);pourCd=180;this.disabled=true};
$('flavor').onclick=function(){var n=S.fl;do{n=(n+1)%FLAVORS.length}while(FLAVORS[n][1]>S.lv);if(n===S.fl){toast('Level '+FLAVORS[1][1]+' unlocks more','Keep scooping');return}S.fl=n;bake();flavorLabel();rings.push({x:W/2,y:H/2,r:8,a:1});save()};
$('milk').onclick=function(){var on=document.body.classList.toggle('milk');this.setAttribute('aria-pressed',on);this.textContent=on?'Drink the milk':'Add milk'};
$('reset').onclick=function(){if(!confirm('Reset your Prism Crunch progress?'))return;try{localStorage.removeItem('prismcrunch1')}catch(e){}location.reload()};
addEventListener('pointermove',function(e){if(mx>-9000){pvx+=e.clientX-mx;pvy+=e.clientY-my}mx=e.clientX;my=e.clientY});
document.addEventListener('pointerout',function(e){if(!e.relatedTarget&&e.pointerType==='mouse')mx=my=-9999});
addEventListener('pointerdown',function(e){mx=e.clientX;my=e.clientY;if(e.target.closest('button,a,#hud'))return;slurp(mx,my)});
addEventListener('resize',size);addEventListener('pagehide',save);
bake();size();flavorLabel();loop();
})();
</script>
