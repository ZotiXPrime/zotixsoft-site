<style>
:root{--teal:#2ee6d0;--gold:#e9cf94;--bg:#031414;--ink:#e8fffb;--dim:#7fb8b1;--acc:var(--teal)}
.gold{--acc:var(--gold)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif}
a{color:inherit}
header{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;padding:20px 48px}
header img{height:30px;display:block}
.back{color:var(--dim);text-decoration:none;font-size:14px;letter-spacing:.12em;text-transform:uppercase}
.back:hover{color:var(--acc)}
.hero{position:relative;height:78vh;min-height:460px;overflow:hidden;background:linear-gradient(135deg,#222,#a00)}
.hero video,.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,#031414cc 35%,transparent 75%),linear-gradient(0deg,var(--bg) 0,transparent 40%)}
.info{position:absolute;z-index:2;left:48px;bottom:56px;max-width:620px}
.meta{color:var(--acc);font-size:13px;letter-spacing:.16em;text-transform:uppercase}
h1{font-family:"Cormorant Garamond",serif;font-size:clamp(44px,7vw,84px);line-height:1;margin:10px 0 14px;text-shadow:0 4px 30px #000}
.desc{font-size:18px;line-height:1.5;color:#d8f3ef;margin:0}
.plaque{display:inline-block;margin-top:16px;padding:6px 12px;border:1px solid #d9b46a88;color:var(--gold);font-size:12px;letter-spacing:.18em;text-transform:uppercase;background:#0006}
.btns{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 22px;border-radius:8px;background:var(--acc);color:#012;font-weight:700;border:0;cursor:pointer;font-size:15px;text-decoration:none;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid #fff4}
section{padding:24px 48px 8px}
h2{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);font-weight:600;margin:0 0 14px}
.gold h2{font-family:"Cormorant Garamond",serif;font-size:22px;letter-spacing:.12em;text-transform:none;color:var(--gold)}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.shots img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;border:1px solid #ffffff14;cursor:zoom-in;transition:transform .2s}
.shots img:hover{transform:scale(1.02)}
.shots:empty::before{content:"Screenshots coming soon.";color:var(--dim)}
.peers{display:flex;gap:16px;overflow-x:auto;padding-bottom:10px}
.tile{flex:0 0 220px;height:124px;border-radius:10px;display:flex;align-items:flex-end;padding:10px;font-weight:700;text-decoration:none;position:relative;overflow:hidden;text-shadow:0 2px 6px #000;transition:transform .18s,box-shadow .18s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#0009)}
.tile span{position:relative}
.tile:hover,.tile:focus{transform:scale(1.06);box-shadow:0 0 0 3px var(--acc)}
footer{padding:40px 48px;color:var(--dim);font-size:13px}
#lb{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb img{max-width:94vw;max-height:90vh;border-radius:8px}
@media (max-width:640px){header,section,footer{padding-left:16px;padding-right:16px}.info{left:16px;right:16px;bottom:32px}.desc{font-size:16px}}
</style>
</head>
<body class="">
<header><a href="/"><img src="../art/zotixsoft_logo_transparent.png" alt="ZOTIXSOFT"></a><a class="back" href="../">← Library</a></header>
<div class="hero">
 <div class="info">
  <div class="meta">Roblox · Available now</div>
  <h1>Kage Rising</h1>
  <p class="desc">Shinobi battleground. Live now.</p>
  <div class="plaque">Gallery No. 034 · Roblox · Arvin Zotix</div>
  <div class="btns"><a class="btn" href="https://www.roblox.com/discover?Keyword=Kage%20Rising" target="_blank" rel="noopener">Find on Roblox</a><a class="btn ghost" href="../">Back to Library</a></div>
 </div>
</div>
<section><h2>Gallery</h2><div class="shots"></div></section>

<footer>© 2026 ZotixSoft LLC · Made by <a href="/arvin-setareh">Arvin Setareh</a></footer>
<div id="lb" onclick="this.style.display='none'"><img alt=""></div>
<script>
document.querySelectorAll('.shots img').forEach(i=>i.onclick=()=>{lb.querySelector('img').src=i.src;lb.style.display='flex'});
addEventListener('keydown',e=>{if(e.key==='Escape'||e.key==='Backspace'){if(lb.style.display==='flex')lb.style.display='none';else location.href='../'}});
</script>
</body>
</html>
